<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="An unofficial, fan-made convenience player for solving the Charleston City Paper's weekly crossword online. Not affiliated with the Charleston City Paper; no copyright is claimed over the puzzle content.">
<title>__OG_TITLE__</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<!-- __OG_TITLE__/__OG_URL__/__OG_IMAGE__ are placeholder tokens filled in per-puzzle
     by build.js (see buildPuzzleVariants()) -- link-preview crawlers (iMessage, Slack,
     etc.) read these from the static HTML without running JS, so each puzzle/archive
     entry needs its own baked-in copy rather than relying on the client-side title swap
     in loadPuzzleData(). This source file keeps the literal placeholder tokens; only the
     built dist/ variants get real values. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Charleston City Paper Crossword">
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="An unofficial, fan-made convenience player for solving the Charleston City Paper's weekly crossword online.">
<meta property="og:image" content="__OG_IMAGE__">
<meta property="og:url" content="__OG_URL__">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__OG_TITLE__">
<meta name="twitter:image" content="__OG_IMAGE__">
<style>
  :root{
    --paper:#f6f1e6;
    --ink:#1c1a17;
    --rule:#c9beac;
    --accent:#a3312a;
    --cell:#fffdf8;
    --black:#1c1a17;
    --hi:#F8EDD4;
    --hi2:#e8c266;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    padding:14px;
  }
  header{
    text-align:center;
    border-bottom:3px double var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  header .kicker{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:11px;
    text-transform:uppercase;
    color:#594923;
  }
  header .kicker .kicker-date{
    margin-top:4px;
  }
  header h1{
    margin:4px 0 2px;
    font-size:26px;
    letter-spacing:1px;
  }
  header .sub{
    font-size:12.5px;
    font-style:italic;
    color:#5a5346;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
  }
  button{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--cell);
    border:1px solid var(--ink);
    color:var(--ink);
    padding:7px 12px;
    cursor:pointer;
    border-radius:2px;
  }
  button:active{ transform:translateY(1px); }
  .toolbar a{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--cell);
    border:1px solid var(--ink);
    color:var(--ink);
    padding:7px 12px;
    border-radius:2px;
    text-decoration:none;
  }
  button.active{
    background:var(--ink);
    color:var(--paper);
  }
  #hamburgerBtn{
    display:none;
  }

  /* ---- Normal mode: comfortable centered layout ---- */
  #app{
    display:flex;
    gap:22px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
    max-width:1000px;
    margin:0 auto;
  }
  #leftCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
  }
  #gridWrap{
    display:flex;
    justify-content:center;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(15, minmax(20px,28px));
    grid-template-rows:repeat(15, minmax(20px,28px));
    border:2px solid var(--ink);
  }
  .cell{
    position:relative;
    background:var(--cell);
    border:0.5px solid var(--rule);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cell.black{ background:var(--black); cursor:pointer; }
  .cell.white input{
    width:100%;
    height:100%;
    border:none;
    background:transparent;
    text-align:center;
    text-transform:uppercase;
    font-family:Georgia, serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    caret-color:transparent;
  }
  .cell.white input:focus{ outline:none; }
  /* The JS selects the existing letter on focus so the next keystroke
     replaces it instead of inserting beside it (see focusInput) -- but the
     browser's default blue/gray selection paint over a single centered
     letter just reads as visual noise, not a real "selection" affordance,
     so paint it as plain background instead of highlighting it. */
  .cell.white input::selection{ background:transparent; color:var(--ink); }
  .cell .num{
    position:absolute;
    top:0.5px; left:1.5px;
    font-size:7.5px;
    font-family:monospace;
    color:#060687;
    pointer-events:none;
  }
  .cell.hi{ background:var(--hi); }
  .cell.hi2{ background:var(--hi2); }
  #cluesPanel{
    display:flex;
    gap:16px;
    flex:1 1 340px;
    min-width:280px;
    max-width:460px;
    height:600px;
    padding:10px 12px;
    border:1px solid var(--rule);
    background:var(--cell);
    position:relative;
  }
  .cluecol{
    flex:1;
    min-width:0;
    height:100%;
    overflow-y:auto;
    padding-right:4px;
  }
  .cluecol h2{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    border-bottom:2px solid var(--ink);
    padding-bottom:4px;
    margin:0 0 6px;
    position:sticky;
    top:0;
    background:var(--cell);
  }
  .clue{
    font-size:12px;
    line-height:1.45;
    padding:2px 4px 2px 7px;
    cursor:pointer;
    border-radius:2px;
    border-left:3px solid transparent;
    /* Active/crossing state is conveyed with background + border-left + color
       only -- deliberately NOT font-weight, which changes glyph widths and
       reflows the whole clue column's line-wrapping as you navigate. */
  }
  .clue:hover{ background:#efe6d2; }
  .clue.active{ background:var(--hi2); border-left-color:#594923; color:#594923; }
  .clue.crossing{ background:var(--hi); color:#594923; }
  .clue b{ margin-right:4px; }
  @media(max-width:860px){
    #app{ flex-direction:column; align-items:center; }
    #cluesPanel{ max-width:640px; height:auto; }
    .cluecol{ height:auto; overflow-y:visible; }
  }

  /* ---- Focus mode: fills the viewport. Grid sized off available HEIGHT
     (the constrained dimension for a square grid next to a text panel),
     clue panel fills whatever width is left. Header/toolbar tucked behind
     the hamburger so nothing but grid+clues takes up room. ---- */
  body.focus-mode{
    overflow:hidden;
    padding:0;
    height:100vh;
    height:100dvh;
  }
  body.focus-mode header,
  body.focus-mode .toolbar,
  body.focus-mode footer{ display:none; }
  body.focus-mode #hamburgerBtn{
    display:block;
    position:absolute;
    top:-1px; right:-1px;
    z-index:10;
    /* Must stay above the dropdown panel once it's open, or the panel covers
       the button and there's no way to click it again to close. */
    font-size:20px;
    line-height:20px;
    padding:5px 7px;
    border:1.5px solid var(--rule);
    background:var(--cell);
    border-radius:0;
  }
  body.focus-mode #app{
    max-width:none;
    width:100vw;
    height:100vh;
    height:100dvh;
    margin:0;
    padding:12px 14px;
    box-sizing:border-box;
    align-items:stretch;
    flex-wrap:nowrap;
    gap:16px;
  }
  body.focus-mode #leftCol{ height:100%; }
  body.focus-mode #gridWrap{ height:100%; }
  body.focus-mode #grid{
    height:100%;
    width:auto;
    aspect-ratio:1/1;
    grid-template-columns:repeat(15, 1fr);
    grid-template-rows:repeat(15, 1fr);
  }
  body.focus-mode .cell.white input{ font-size:clamp(11px, 3.2vmin, 30px); }
  body.focus-mode .cell .num{ font-size:clamp(9.5px, 1.3vmin, 15.5px); }
  body.focus-mode #cluesPanel{
    flex:1 1 auto;
    max-width:none;
    height:100%;
  }
  /* Clue text can afford to be noticeably bigger once the panel isn't
     capped at a small fixed width. */
  body.focus-mode .clue{ font-size:14.5px; line-height:1.5; }
  body.focus-mode .cluecol h2{ font-size:14px; }
  /* Toolbar doubles as the hamburger's dropdown panel in focus mode.
     Focus/Exit are mutually exclusive depending on which mode is active.
     top/right are set via JS to align exactly with #cluesPanel's own corner
     (see positionToolbarDropdown) rather than guessed here. */
  #focusBtn{ display:inline-block; }
  body.focus-mode #focusBtn{ display:none; }
  #exitFocusBtn{ display:none; }
  body.focus-mode #exitFocusBtn{ display:inline-block; }
  body.focus-mode #toolbar{
    display:none;
    position:fixed;
    z-index:9;
    flex-direction:column;
    align-items:stretch;
    background:var(--cell);
    border:2px solid var(--ink);
    padding:12px;
    gap:8px;
    min-width:230px;
  }
  body.focus-mode #toolbar button{
    padding:9px 14px;
    font-size:12.5px;
  }
  body.focus-mode #toolbar.open{ display:flex; }
  /* Full-width row under grid+clues in focus mode -- the completion badge
     moves here (via JS) so it spans the whole app, not just the grid column.
     sizeFocusMode() measures its rendered height and shrinks #app to match,
     so it never gets pushed below the fold. */
  #focusBadgeRow{ display:none; }
  body.focus-mode #focusBadgeRow{
    display:flex;
    justify-content:center;
    width:100vw;
    box-sizing:border-box;
    padding:0 14px 12px;
  }
  body.focus-mode #focusBadgeRow .status-badge{
    max-width:none;
    width:100%;
    font-size:12px;
  }
  @media(max-width:700px){
    body.focus-mode #app{ flex-direction:column; }
    body.focus-mode #leftCol{ height:auto; flex:0 0 auto; }
    body.focus-mode #grid{ height:auto; width:min(94vw,94vh); }
    body.focus-mode #cluesPanel{ flex:1 1 auto; min-height:0; }
  }

  footer{
    text-align:center;
    font-size:11px;
    color:#8a8272;
    margin-top:20px;
    font-family:'Courier New',monospace;
  }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(28,26,23,0.55);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--paper);
    border:2px solid var(--ink);
    padding:18px 20px;
    max-width:480px;
    width:100%;
    box-sizing:border-box;
    font-family:Georgia, serif;
  }
  .modal-box h3{ margin:0 0 8px; font-size:16px; }
  .modal-box p{ margin:0 0 10px; font-size:12.5px; line-height:1.5; color:#5a5346; }
  .modal-box textarea{
    width:100%;
    height:110px;
    font-family:'Courier New',monospace;
    font-size:11.5px;
    padding:8px;
    box-sizing:border-box;
    border:1px solid var(--rule);
    resize:vertical;
    background:var(--cell);
    color:var(--ink);
  }
  .modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:12px;
  }
  /* Persistent status, not a one-off popup -- just reflects current grid
     fill state. Will also carry a match/mismatch count once there's an
     actual solution to compare against; for now it can only say "filled". */
  .status-badge{
    display:none;
    font-family:'Courier New',monospace;
    font-size:11px;
    letter-spacing:0.5px;
    padding:7px 12px;
    border:1px solid var(--rule);
    background:var(--cell);
    color:var(--ink);
    align-self:center;
    margin-top:12px;
    max-width:320px;
    text-align:center;
    line-height:1.5;
  }
  .status-badge.show{ display:inline-block; }
  /* Understated either way -- a mismatch isn't an error state, just a note */
  .status-badge.match{ background:#dce8dc; }
  .status-badge.mismatch{ background:#efe2c8; }
</style>
</head>
<body>

<header>
  <div class="kicker" id="kicker">
    <div class="kicker-title">Charleston City Paper Crossword</div>
    <div class="kicker-date" id="kickerDate"></div>
  </div>
  <h1 id="puzzleTitle"></h1>
  <div class="sub" id="puzzleSub"></div>
</header>

<div class="toolbar" id="toolbar">
  <button id="focusBtn">Focus mode</button>
  <button id="clearBtn">Clear all</button>
  <a id="archiveBtn" href="/archive">Archive</a>
</div>

<div id="app">
  <div id="leftCol">
    <div id="gridWrap"><div id="grid"></div></div>
    <span id="completionStatus" class="status-badge"><span id="completionStatusText"></span><a id="completionSourceLink" href="#" target="_blank" rel="noopener" style="display:none; margin-top:4px; color:inherit;">(source)</a></span>
  </div>
  <div id="cluesPanel">
    <button id="hamburgerBtn" aria-label="Tools">&#9776;</button>
    <div class="cluecol">
      <h2>Across</h2>
      <div id="acrossList"></div>
    </div>
    <div class="cluecol">
      <h2>Down</h2>
      <div id="downList"></div>
    </div>
  </div>
</div>

<!-- Focus mode only: the completion badge moves here (via JS) so it spans
     the full width under grid+clues instead of just the grid column. -->
<div id="focusBadgeRow"></div>

<footer>Remembers your progress in this browser. When the grid's fully filled, we'll tell you if your solve matches <span id="footerSolveNote">our reference solve</span>.</footer>

<script>
const SIZE = 15;

// Puzzle data (grid pattern, clues, title, byline, reference-solve salt) lives
// in a per-week file under puzzles/, not hardcoded here -- see
// loadPuzzleData() in boot() below. This file is a static shell that fetches
// puzzles/index.json to find the current week's file (either the current
// week by default, ?puzzle=<id>, or a pretty /archive/<id> URL -- see below)
// and fills these in before the grid is built. This also fixes the old bug
// where the <title>/header stayed stuck on whichever puzzle was last
// hand-edited into this file.
let pattern, ACROSS, DOWN, SOLUTION_SALT, SOLUTION_HASHES_FILE, PUZZLE_ID, SOLUTION_SOURCE, SOLUTION_SOURCE_URL;

async function loadPuzzleData(){
  const [pathname, search] = (location.pathname + location.search).split('?');
  const archiveMatch = pathname.match(/\/archive\/([^/?#]+)/);
  const requestedId = (archiveMatch && decodeURIComponent(archiveMatch[1]))
    || new URLSearchParams(search || '').get('puzzle');

  // Root-relative (not relative) so this still resolves correctly when the
  // visible URL is a nested path like /archive/<id> rather than /.
  const idxRes = await fetch('/puzzles/index.json', {cache:'no-store'});
  const index = await idxRes.json();
  const entry = (requestedId && index.find(p=>p.id===requestedId)) || index[0];
  const res = await fetch('/' + entry.file, {cache:'no-store'});
  const data = await res.json();

  pattern = data.pattern;
  ACROSS = data.across;
  DOWN = data.down;
  SOLUTION_SALT = data.solutionSalt;
  SOLUTION_HASHES_FILE = data.solutionHashesFile;
  PUZZLE_ID = data.id;
  // "reference" (default) = someone's submitted solve, not authoritative.
  // "official" = transcribed from the answer key printed in a later issue.
  // Only changes the completion wording below -- same hash-compare mechanism either way.
  SOLUTION_SOURCE = data.solutionSource || 'reference';
  // Deep link to the later issue's viewer page where the printed answer key
  // appears -- lets a player verify the "official" claim against the actual
  // source instead of just trusting the badge. Only meaningful/shown when
  // SOLUTION_SOURCE is 'official'.
  SOLUTION_SOURCE_URL = data.officialSolutionUrl || null;

  document.title = data.title + ' \u2014 Charleston City Paper Crossword';
  document.getElementById('kickerDate').textContent = data.kickerDate;
  document.getElementById('puzzleTitle').textContent = data.title;
  document.getElementById('puzzleSub').textContent = data.subtitle;
  document.getElementById('footerSolveNote').textContent = SOLUTION_SOURCE === 'official'
    ? 'the official answer key from a later issue'
    : 'our reference solve';
}

// Optional reference solve for match/mismatch comparison -- NOT an official
// answer key, just whatever solve someone (the person who built/shared this
// artifact) chose to submit once they finished it themselves.
//
// The actual answer letters are never shipped anywhere in this file or repo.
// Each puzzle's solutionHashesFile holds one SHA-256 hash per Across/Down
// entry (e.g. "1A-<hash>"), each hash covering that whole answer word,
// salted with that puzzle's SOLUTION_SALT. The browser hashes whatever the
// player typed for each entry and compares hashes -- it can tell you how
// many answers don't match, never which letters are right. This is a
// deterrent, not a vault: SOLUTION_SALT is public (has to be, the client
// needs it too), and a scripted client could in principle narrow individual
// answers down faster than guessing blind by watching how the mismatch count
// changes as it tries words.
let SOLUTION_HASHES = null; // null = no reference solve available/loaded
async function loadSolutionHashes(){
  try{
    const res = await fetch('/' + SOLUTION_HASHES_FILE, {cache:'no-store'});
    if(!res.ok) return;
    const text = await res.text();
    const map = {};
    for(const line of text.split('\n')){
      const trimmed = line.trim();
      if(!trimmed) continue;
      const idx = trimmed.indexOf('-');
      if(idx<0) continue;
      map[trimmed.slice(0,idx)] = trimmed.slice(idx+1);
    }
    SOLUTION_HASHES = map;
  }catch(err){ /* no reference solve available right now */ }
}
function wordText(start,dir){
  let word='';
  for(let i=0;i<start.len;i++){
    const r = start.r + (dir==='D'?i:0);
    const c = start.c + (dir==='A'?i:0);
    word += grid[r][c].letter || ' ';
  }
  return word;
}

let grid = []; // {black, letter}
let cur = {r:0,c:0,dir:'A'}; // dir A = across, D = down
let numbers = []; // number per cell, 0 if none
let acrossStart = {}; // number -> {r,c,len}
let downStart = {};

function initGrid(){
  grid = [];
  for(let r=0;r<SIZE;r++){
    let row=[];
    for(let c=0;c<SIZE;c++){
      row.push({black: pattern[r][c]==='#', letter:''});
    }
    grid.push(row);
  }
}

function computeNumbers(){
  numbers = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  acrossStart = {}; downStart = {};
  let n=1;
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(grid[r][c].black) continue;
      const leftBlack = (c===0)||grid[r][c-1].black;
      const rightWhite = (c<SIZE-1)&&!grid[r][c+1].black;
      const upBlack = (r===0)||grid[r-1][c].black;
      const downWhite = (r<SIZE-1)&&!grid[r+1][c].black;
      const startsAcross = leftBlack && rightWhite;
      const startsDown = upBlack && downWhite;
      if(startsAcross || startsDown){
        numbers[r][c]=n;
        if(startsAcross){
          let len=0,cc=c;
          while(cc<SIZE && !grid[r][cc].black){len++;cc++;}
          acrossStart[n]={r,c,len};
        }
        if(startsDown){
          let len=0,rr=r;
          while(rr<SIZE && !grid[rr][c].black){len++;rr++;}
          downStart[n]={r,c,len};
        }
        n++;
      }
    }
  }
}

function render(){
  computeNumbers();
  const gridEl = document.getElementById('grid');
  gridEl.innerHTML='';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell = grid[r][c];
      const div = document.createElement('div');
      div.className = 'cell ' + (cell.black?'black':'white');
      div.dataset.r=r; div.dataset.c=c;
      if(!cell.black){
        if(numbers[r][c]){
          const num = document.createElement('div');
          num.className='num';
          num.textContent = numbers[r][c];
          div.appendChild(num);
        }
        const input = document.createElement('input');
        input.value = cell.letter;
        input.autocomplete='off';
        input.spellcheck=false;
        // Mouse/touch selection is handled entirely by the click listener below.
        // (A 'focus' listener here used to pre-empt it: focus fires before click,
        // so it would move `cur` to the new cell first, making the click handler's
        // "did I click the already-current cell?" check always true and toggling
        // orientation on every click instead of just same-cell re-clicks.)
        input.addEventListener('click', ()=> selectCell(r,c,null,true));
        input.addEventListener('keydown', (e)=> handleKey(e,r,c));
        input.addEventListener('input', (e)=> handleInput(e,r,c));
        div.appendChild(input);
      }
      gridEl.appendChild(div);
    }
  }
  renderClues();
  highlight();
}

function selectCell(r,c,dir,fromClick){
  if(grid[r][c].black) return;
  if(fromClick){
    if(cur.r===r && cur.c===c){
      cur.dir = cur.dir==='A' ? 'D' : 'A';
    } else {
      cur.dir = bestDirFor(r,c,cur.dir);
    }
  }
  cur.r=r; cur.c=c;
  if(dir) cur.dir=dir;
  highlight();
  focusInput(r,c);
}

function bestDirFor(r,c,preferred){
  const inAcross = wordAt(r,c,'A');
  const inDown = wordAt(r,c,'D');
  if(preferred==='A' && inAcross) return 'A';
  if(preferred==='D' && inDown) return 'D';
  if(inAcross) return 'A';
  if(inDown) return 'D';
  return preferred;
}

function wordAt(r,c,dir){
  if(dir==='A'){
    for(const n in acrossStart){
      const w=acrossStart[n];
      if(w.r===r && c>=w.c && c<w.c+w.len) return {num:+n,...w};
    }
  } else {
    for(const n in downStart){
      const w=downStart[n];
      if(w.c===c && r>=w.r && r<w.r+w.len) return {num:+n,...w};
    }
  }
  return null;
}

function focusInput(r,c){
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"] input`);
  if(el){
    el.focus();
    // Select any existing letter so the next keystroke always replaces it,
    // rather than depending on wherever the browser happens to leave the
    // caret (which isn't reliably "at the end" after we set .value via JS,
    // and with caret-color:transparent the user can't see a stray caret
    // position to work around it themselves).
    try{ el.setSelectionRange(0, el.value.length); }catch(e){}
  }
}

function handleInput(e,r,c){
  let v = e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
  v = v.slice(-1);
  grid[r][c].letter = v;
  e.target.value = v;
  if(v){
    const next = nextTypingCell(r,c,cur.dir);
    if(next) selectCell(next.r,next.c);
  }
  queueSave();
  updateCompletionStatus();
}

// A persistent status, not a one-time popup -- just always reflects whether
// the grid is currently fully filled in. NOT a correctness check: there's no
// answer key here to compare against, only "did you fill in every square".
function isGridFull(){
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(!grid[r][c].black && !grid[r][c].letter) return false;
    }
  }
  return true;
}
let completionStatusToken = 0;
async function updateCompletionStatus(){
  const full = isGridFull();
  const badge = document.getElementById('completionStatus');
  const badgeText = document.getElementById('completionStatusText');
  const sourceLink = document.getElementById('completionSourceLink');
  badge.classList.remove('match','mismatch');
  sourceLink.style.display = 'none';

  if(!full){
    badge.classList.remove('show');
    badgeText.textContent = '';
    sizeFocusMode();
    return;
  }
  badge.classList.add('show');

  if(!SOLUTION_HASHES){
    badgeText.textContent = 'Grid complete';
    sizeFocusMode();
    return;
  }
  // Comparing against a submitted reference solve, not an official answer
  // key -- framed as "differs from", never "wrong", and never flags which
  // individual answer (per earlier discussion, that reads as grading). Each
  // Across/Down entry is hashed and compared whole -- see SOLUTION_HASHES
  // above for why, and why this only yields a count, not locations.
  const token = ++completionStatusToken; // avoid a stale async result clobbering a newer one
  let mismatches = 0, total = 0;
  for(const [num,start] of Object.entries(acrossStart)){
    total++;
    const hash = await sha256hex(SOLUTION_SALT + wordText(start,'A'));
    if(hash !== SOLUTION_HASHES[num+'A']) mismatches++;
  }
  for(const [num,start] of Object.entries(downStart)){
    total++;
    const hash = await sha256hex(SOLUTION_SALT + wordText(start,'D'));
    if(hash !== SOLUTION_HASHES[num+'D']) mismatches++;
  }
  if(token !== completionStatusToken) return;
  const isOfficial = SOLUTION_SOURCE === 'official';
  if(mismatches===0){
    badgeText.textContent = isOfficial
      ? 'Well done! Your answers match the official answer key from a later issue.'
      : 'Well done! Your answers match what we think is the complete correct puzzle solve. Check next week’s paper for official answers!';
    badge.classList.add('match');
  } else {
    badgeText.textContent = isOfficial
      ? `Complete — differs from the official answer key, affecting ${mismatches} answer${mismatches===1?'':'s'}.`
      : `Complete — our solve is a little different, affecting ${mismatches} answer${mismatches===1?'':'s'} (we're not the official puzzle master — check next week's paper for official answers!)`;
    badge.classList.add('mismatch');
  }
  if(isOfficial && SOLUTION_SOURCE_URL){
    sourceLink.href = SOLUTION_SOURCE_URL;
    sourceLink.style.display = 'block';
  }
  sizeFocusMode();
}

function handleKey(e,r,c){
  const key = e.key;
  if(key==='Backspace' || key==='Delete'){
    e.preventDefault();
    if(grid[r][c].letter){
      // always clear the current cell first, regardless of direction
      grid[r][c].letter='';
      e.target.value='';
    } else if(key==='Backspace'){
      // already empty: step back one cell in the current word and clear that too
      const prev = advance(r,c,cur.dir,-1);
      if(prev){
        grid[prev.r][prev.c].letter='';
        selectCell(prev.r,prev.c);
        focusInput(prev.r,prev.c);
        // grid state is now cleared, but the input's own DOM value still
        // holds whatever was last typed there -- selectCell/focusInput only
        // move focus, they don't touch .value, so without this the cell
        // looks like backspace did nothing even though it's logically empty.
        const prevEl = document.querySelector(`.cell[data-r="${prev.r}"][data-c="${prev.c}"] input`);
        if(prevEl) prevEl.value = '';
      }
    }
    queueSave();
    updateCompletionStatus();
  } else if(key==='ArrowRight'){ arrowMove(r,c,'A',1); e.preventDefault(); }
  else if(key==='ArrowLeft'){ arrowMove(r,c,'A',-1); e.preventDefault(); }
  else if(key==='ArrowDown'){ arrowMove(r,c,'D',1); e.preventDefault(); }
  else if(key==='ArrowUp'){ arrowMove(r,c,'D',-1); e.preventDefault(); }
  else if(key===' '){ cur.dir = cur.dir==='A'?'D':'A'; highlight(); e.preventDefault(); }
  else if(key==='Tab'){
    // Jump to the next/previous clue (same direction), not the next cell --
    // the browser's default Tab just follows DOM order, i.e. one cell over.
    e.preventDefault();
    const w = wordAt(r,c,cur.dir);
    if(w){
      const target = adjacentWordFirstCell(w.num, cur.dir, e.shiftKey ? -1 : 1);
      if(target) selectCell(target.r, target.c);
    }
  }
}

// NYT-style arrow behavior:
// - Pressing an arrow whose axis matches the current orientation moves the
//   cursor one cell that way (skipping black squares), same as before.
// - Pressing an arrow PERPENDICULAR to the current orientation does NOT move
//   the cursor if the current cell is part of a word in that other direction
//   -- it just re-orients the highlight to that word, in place. Only if the
//   current cell has no word running in that direction (an edge case in some
//   grids) does it jump along that axis to the next cell that does.
function arrowMove(r,c,axis,step){
  if(cur.dir !== axis){
    if(wordAt(r,c,axis)){
      cur.dir = axis;
      highlight();
      return;
    }
    const dr = axis==='D' ? step : 0;
    const dc = axis==='A' ? step : 0;
    let nr=r+dr, nc=c+dc;
    while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){
      if(!grid[nr][nc].black && wordAt(nr,nc,axis)){
        cur.dir = axis;
        selectCell(nr,nc);
        return;
      }
      nr+=dr; nc+=dc;
    }
    cur.dir = axis;
    highlight();
    return;
  }
  const dr = axis==='D' ? step : 0;
  const dc = axis==='A' ? step : 0;
  let nr=r+dr, nc=c+dc;
  while(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&grid[nr][nc].black){ nr+=dr; nc+=dc; }
  if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){
    selectCell(nr,nc);
  } else {
    highlight();
  }
}

function advance(r,c,dir,step){
  const dr = dir==='D'?step:0;
  const dc = dir==='A'?step:0;
  let nr=r+dr, nc=c+dc;
  if(nr<0||nr>=SIZE||nc<0||nc>=SIZE) return null;
  if(grid[nr][nc].black) return null;
  return {r:nr,c:nc};
}

// After typing a letter: jump to the next EMPTY cell in the current word
// (skipping over ones already filled in). If the rest of the word is full,
// wrap back around to the first empty cell earlier in that same word. If the
// whole word is already full, move on to the next word in the same
// direction, same as NYT's solver.
function nextTypingCell(r,c,dir){
  const w = wordAt(r,c,dir);
  if(!w) return advance(r,c,dir,1);
  const cells = [];
  for(let i=0;i<w.len;i++){
    cells.push(dir==='A' ? {r:w.r,c:w.c+i} : {r:w.r+i,c:w.c});
  }
  const idx = cells.findIndex(p=>p.r===r && p.c===c);
  for(let i=idx+1;i<cells.length;i++){
    if(!grid[cells[i].r][cells[i].c].letter) return cells[i];
  }
  for(let i=0;i<idx;i++){
    if(!grid[cells[i].r][cells[i].c].letter) return cells[i];
  }
  return nextWordFirstCell(w.num, dir);
}

// Cells of a word in reading order, e.g. for firstEmptyCellInWord below.
function wordCells(w, dir){
  const cells = [];
  for(let i=0;i<w.len;i++){
    cells.push(dir==='A' ? {r:w.r,c:w.c+i} : {r:w.r+i,c:w.c});
  }
  return cells;
}

// NYT-style: landing on a word that already has some letters filled in
// (e.g. from crossing entries) jumps to its first empty cell, not always
// the very first cell of the word.
function firstEmptyCellInWord(w, dir){
  const cells = wordCells(w, dir);
  return cells.find(p=>!grid[p.r][p.c].letter) || cells[0];
}

function adjacentWordFirstCell(num, dir, step){
  const starts = dir==='A' ? acrossStart : downStart;
  const list = Object.keys(starts).map(Number).sort((a,b)=>a-b);
  const idx = list.indexOf(num);
  if(idx===-1) return null;
  const nextNum = list[(idx+step+list.length) % list.length];
  const w = starts[nextNum];
  return firstEmptyCellInWord(w, dir);
}

function nextWordFirstCell(num, dir){
  return adjacentWordFirstCell(num, dir, 1);
}

function highlight(){
  document.querySelectorAll('#grid .cell').forEach(el=>el.classList.remove('hi','hi2'));
  const w = wordAt(cur.r,cur.c,cur.dir);
  if(w){
    for(let i=0;i<w.len;i++){
      const rr = cur.dir==='A'? w.r : w.r+i;
      const cc = cur.dir==='A'? w.c+i : w.c;
      const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
      if(el) el.classList.add('hi');
    }
  }
  const curEl = document.querySelector(`.cell[data-r="${cur.r}"][data-c="${cur.c}"]`);
  if(curEl) curEl.classList.add('hi2');
  updateActiveClue(w);
}

function updateActiveClue(w){
  document.querySelectorAll('.clue').forEach(el=>el.classList.remove('active','crossing'));
  if(!w) return;
  const id = (cur.dir==='A'?'a-':'d-')+w.num;
  const el = document.getElementById(id);
  if(el){
    el.classList.add('active');
    if(typeof el.scrollIntoView === 'function') el.scrollIntoView({block:'nearest', behavior:'instant'});
  }
  // The crossing word at the current cell -- highlighted (not bold) so you can
  // see at a glance what the intersecting clue is as you move through a word,
  // without it reading as "also selected".
  const crossDir = cur.dir==='A' ? 'D' : 'A';
  const crossWord = wordAt(cur.r, cur.c, crossDir);
  if(crossWord){
    const crossEl = document.getElementById((crossDir==='A'?'a-':'d-')+crossWord.num);
    if(crossEl){
      crossEl.classList.add('crossing');
      if(typeof crossEl.scrollIntoView === 'function') crossEl.scrollIntoView({block:'nearest', behavior:'instant'});
    }
  }
}

function renderClues(){
  const aEl = document.getElementById('acrossList');
  const dEl = document.getElementById('downList');
  aEl.innerHTML=''; dEl.innerHTML='';
  ACROSS.forEach(([num,text])=>{
    const div = document.createElement('div');
    div.className='clue'; div.id='a-'+num;
    div.innerHTML = `<b>${num}.</b>${text}`;
    div.addEventListener('click', ()=>{
      const w = acrossStart[num];
      if(w){ cur.dir='A'; selectCell(w.r,w.c); }
    });
    aEl.appendChild(div);
  });
  DOWN.forEach(([num,text])=>{
    const div = document.createElement('div');
    div.className='clue'; div.id='d-'+num;
    div.innerHTML = `<b>${num}.</b>${text}`;
    div.addEventListener('click', ()=>{
      const w = downStart[num];
      if(w){ cur.dir='D'; selectCell(w.r,w.c); }
    });
    dEl.appendChild(div);
  });
}

// ---- Focus mode: hides header/toolbar, grid fills the viewport height,
// clue panel fills the remaining width. Toolbar becomes a hamburger dropdown. ----
const hamburgerBtn = document.getElementById('hamburgerBtn');
const toolbarEl = document.getElementById('toolbar');
const appEl = document.getElementById('app');
const focusBadgeRowEl = document.getElementById('focusBadgeRow');
const leftColEl = document.getElementById('leftCol');
const completionStatusEl = document.getElementById('completionStatus');

// CSS 100vh/100dvh assumes #app starts at the very top of the viewport, which
// isn't necessarily true here -- if this is embedded in something with its own
// chrome above it (e.g. an artifact viewer's header bar), #app actually starts
// lower than that, and 100vh overshoots the real available space by exactly
// however tall that chrome is. Measuring #app's actual on-screen position (and
// #focusBadgeRow's actual rendered height, so #app doesn't overlap the badge
// once it appears) and sizing off THAT is correct regardless of what (if
// anything) sits above/below it.
function sizeFocusMode(){
  if(!document.body.classList.contains('focus-mode')) return;
  const top = appEl.getBoundingClientRect().top;
  const barHeight = focusBadgeRowEl.offsetHeight;
  const bottomMargin = 12;
  const available = window.innerHeight - top - barHeight - bottomMargin;
  appEl.style.height = Math.max(200, available) + 'px';
}
window.addEventListener('resize', sizeFocusMode);

// Align the dropdown's top-right corner exactly with #cluesPanel's own
// top-right corner (same measure-don't-guess approach as sizeFocusMode),
// so it sits flush against the panel -- covering the Across/Down header
// strip underneath rather than floating with a gap above or beside it.
const cluesPanelEl = document.getElementById('cluesPanel');
function positionToolbarDropdown(){
  if(!document.body.classList.contains('focus-mode')) return;
  const rect = cluesPanelEl.getBoundingClientRect();
  toolbarEl.style.top = rect.top + 'px';
  toolbarEl.style.right = (window.innerWidth - rect.right) + 'px';
  toolbarEl.style.left = 'auto';
}
window.addEventListener('resize', positionToolbarDropdown);

document.getElementById('focusBtn').addEventListener('click', (e)=>{
  document.body.classList.add('focus-mode');
  toolbarEl.classList.remove('open');
  focusBadgeRowEl.appendChild(completionStatusEl);
  const raf = window.requestAnimationFrame || (fn => setTimeout(fn, 16));
  raf(()=>{ sizeFocusMode(); positionToolbarDropdown(); });
});
hamburgerBtn.addEventListener('click', (e)=>{
  e.stopPropagation(); // don't let this immediately trigger the outside-click-closes listener below
  positionToolbarDropdown();
  toolbarEl.classList.toggle('open');
});
// Click anywhere outside the open dropdown closes it -- the standard way people
// expect to dismiss this kind of menu, on top of clicking the hamburger again.
document.addEventListener('click', (e)=>{
  if(toolbarEl.classList.contains('open') && !toolbarEl.contains(e.target)){
    toolbarEl.classList.remove('open');
  }
});
// Any toolbar action closes the dropdown afterward, and exiting focus mode
// is just another toolbar button so it's reachable from the same menu.
const exitFocusBtn = document.createElement('button');
exitFocusBtn.id = 'exitFocusBtn';
exitFocusBtn.textContent = 'Exit focus mode';
exitFocusBtn.addEventListener('click', ()=>{
  document.body.classList.remove('focus-mode');
  toolbarEl.classList.remove('open');
  appEl.style.height = ''; // hand sizing back to normal-mode CSS
  leftColEl.appendChild(completionStatusEl);
});
toolbarEl.appendChild(exitFocusBtn);
toolbarEl.addEventListener('click', (e)=>{
  if(document.body.classList.contains('focus-mode') && e.target.tagName==='BUTTON'){
    toolbarEl.classList.remove('open');
  }
});
// Esc exits focus mode -- standard convention for a fullscreen-ish view, and
// works even mid-typing since it fires on the grid's own inputs too.
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.body.classList.contains('focus-mode')){
    exitFocusBtn.click();
  }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear the whole grid? This can\'t be undone.')) return;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c].black) grid[r][c].letter='';
  render();
  queueSave();
  updateCompletionStatus();
});

// ---- Persistence: autosaves your letters, restores on reopen ----
// PUZZLE_ID is set by loadPuzzleData() (see top of script), sourced from
// this week's puzzles/*.json -- each week gets its own id so progress
// doesn't bleed across puzzles.
let saveTimer = null;
let lastSavedSnapshot = null;
let saveErrorLogged = false;

// Plain localStorage -- the standard web API for client-only persistence.
// No server involved here, so there's nothing a cookie would gain you: it'd
// just add a ~4KB ceiling and get sent along with requests that don't exist.
const storageAdapter = {
  async get(key){
    try{
      const raw = window.localStorage.getItem('crossword:'+key);
      return raw===null ? null : {key, value: raw};
    }catch(e){ return null; } // e.g. localStorage blocked (private browsing, etc.)
  },
  async set(key, value){
    try{
      window.localStorage.setItem('crossword:'+key, value);
      return {key, value};
    }catch(e){ return null; }
  }
};

function queueSave(){
  clearTimeout(saveTimer);
  // Debounced generously: typing a crossword involves lots of keystrokes with
  // normal thinking pauses well over a few hundred ms, so a short debounce
  // ends up firing a save on nearly every letter and can trip storage rate
  // limits. visibilitychange/pagehide below covers the "closed before the
  // debounce fired" case, so this can safely be long.
  saveTimer = setTimeout(()=>saveState(), 1500);
}

function currentSnapshot(){
  const rows = [];
  for(let r=0;r<SIZE;r++){
    let row = '';
    for(let c=0;c<SIZE;c++){
      const cell = grid[r][c];
      row += cell.black ? '#' : (cell.letter || '.');
    }
    rows.push(row);
  }
  return JSON.stringify({rows});
}

async function saveState(attempt=0){
  const snapshot = currentSnapshot();
  if(snapshot === lastSavedSnapshot) return; // nothing changed since last successful save
  try{
    const result = await storageAdapter.set(PUZZLE_ID, snapshot);
    if(result){
      lastSavedSnapshot = snapshot;
      saveErrorLogged = false;
    } else if(attempt < 1){
      // a falsy result (not a thrown error) can mean a transient failure --
      // worth one retry
      setTimeout(()=>saveState(attempt+1), 1000);
    }
  }catch(err){
    if(attempt < 1){
      setTimeout(()=>saveState(attempt+1), 1000);
    } else if(!saveErrorLogged){
      // Log once, not on every keystroke, so a real underlying issue is
      // still visible without spamming the console while someone plays.
      console.warn('Crossword autosave is unavailable right now (progress will still show in this session, but may not persist if you close the tab):', err);
      saveErrorLogged = true;
    }
  }
}

// Best-effort final save if the tab is hidden/closed before the debounce fires
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveState(); });
window.addEventListener('pagehide', ()=> saveState());

async function loadState(){
  try{
    const res = await storageAdapter.get(PUZZLE_ID);
    if(!res || !res.value) return false;
    const data = JSON.parse(res.value);
    if(!data.rows || data.rows.length!==SIZE) return false;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const ch = data.rows[r][c];
        pattern[r] = pattern[r].substring(0,c) + (ch==='#'?'#':'.') + pattern[r].substring(c+1);
        if(ch!=='#' && ch!=='.') restoredLetters[r][c] = ch;
      }
    }
    lastSavedSnapshot = res.value;
    return true;
  }catch(err){ return false; } // no saved state yet, or storage unavailable
}

let restoredLetters = Array.from({length:SIZE},()=>Array(SIZE).fill(''));

(async function boot(){
  await loadPuzzleData();
  const [restored] = await Promise.all([loadState(), loadSolutionHashes()]);
  initGrid();
  if(restored){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(restoredLetters[r][c]) grid[r][c].letter = restoredLetters[r][c];
    }
  }
  render();
  updateCompletionStatus();
})();

// grid initialization + first render happens in boot() above, after checking for saved progress

async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
</script>
