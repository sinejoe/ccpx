<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Archive of past weekly Charleston City Paper crosswords, playable online. An unofficial, fan-made convenience player -- not affiliated with the Charleston City Paper; no copyright is claimed over the puzzle content.">
<title>Archive — Charleston City Paper Crossword</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root{
    --paper:#f6f1e6;
    --ink:#1c1a17;
    --rule:#c9beac;
    --accent:#a3312a;
    --cell:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    padding:14px;
  }
  header{
    text-align:center;
    border-bottom:3px double var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  header .kicker{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:11px;
    text-transform:uppercase;
    color:#594923;
  }
  header h1{
    margin:4px 0 2px;
    font-size:26px;
    letter-spacing:1px;
  }
  #list{
    max-width:520px;
    margin:0 auto;
    border-top:1px solid var(--rule);
  }
  #list a{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:12px 4px;
    border-bottom:1px solid var(--rule);
    color:var(--ink);
    text-decoration:none;
  }
  #list a:hover{ background:var(--cell); }
  #list .title-row{ display:flex; align-items:center; gap:8px; }
  #list .title{ font-size:15px; }
  #list .current-tag{
    font-family:'Courier New', monospace;
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--accent);
    color:var(--paper);
    padding:2px 6px;
    border-radius:2px;
    white-space:nowrap;
  }
  #list .date{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    color:#5a5346;
    white-space:nowrap;
    align-self:center;
  }
  #empty{ text-align:center; color:#5a5346; font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="kicker">Charleston City Paper Crossword</div>
  <h1>Archive</h1>
</header>

<div id="list"></div>
<p id="empty" style="display:none;">No past puzzles yet.</p>

<script>
(async function(){
  const res = await fetch('/puzzles/index.json', {cache:'no-store'});
  const index = await res.json();
  const listEl = document.getElementById('list');
  if(index.length === 0){
    document.getElementById('empty').style.display = 'block';
    return;
  }
  // index[0] is the current week (index.json is newest-first) -- it links
  // to "/" rather than "/archive/<id>" since that's the live/active puzzle,
  // not yet an archived one. It naturally moves off this slot and gets a
  // normal /archive/<id> link once a new week's entry is published above it.
  index.forEach((entry, i) => {
    const a = document.createElement('a');
    a.href = (i === 0) ? '/' : ('/archive/' + entry.id);
    const titleRow = document.createElement('span');
    titleRow.className = 'title-row';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = entry.title;
    titleRow.appendChild(title);
    if(i === 0){
      const tag = document.createElement('span');
      tag.className = 'current-tag';
      tag.textContent = 'Current Puzzle';
      titleRow.appendChild(tag);
    }
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = entry.date;
    a.appendChild(titleRow);
    a.appendChild(date);
    listEl.appendChild(a);
  });
})();
</script>

</body>
</html>
